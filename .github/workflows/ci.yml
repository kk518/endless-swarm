name: Verify prototype
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: endless-swarm-h5
          path: dist/
